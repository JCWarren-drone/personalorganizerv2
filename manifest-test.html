<!doctype html><meta charset="utf-8"><title>Manifest test</title><h1>Pokud vidis tuto stranku, web bezi</h1><p>Otevri: <a href="manifest.json">manifest.json</a> - musi se zobrazit JSON, ne 404.</p><script>fetch('manifest.json').then(r=>{document.body.insertAdjacentHTML('beforeend','<p>manifest.json status: '+r.status+'</p>');return r.json()}).then(j=>{document.body.insertAdjacentHTML('beforeend','<p>name: '+j.name+'</p>')}).catch(e=>{document.body.insertAdjacentHTML('beforeend','<p style=color:red>CHYBA: '+e+'</p>')})</script>
